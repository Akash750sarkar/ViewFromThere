services:
  rabbitmq:
    image: rabbitmq:3
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    command:
      - redis-server
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
    restart: unless-stopped

  user-service:
    build:
      context: ./services/user
    container_name: user-service
    ports:
      - "5000:5000"
    env_file:
      - ./services/user/.env
    restart: unless-stopped

  author-service:
    build:
      context: ./services/author
    container_name: author-service
    ports:
      - "5001:5001"
    env_file:
      - ./services/author/.env
    environment:
      - RabbitMQ_Host=rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  blog-service:
    build:
      context: ./services/blog
    container_name: blog-service
    ports:
      - "5002:5002"
    env_file:
      - ./services/blog/.env
    environment:
      - REDIS_URL=redis://redis:6379
      - RabbitMQ_Host=rabbitmq
      - USER_SERVICE=http://user-service:5000
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
      user-service:
        condition: service_started
    restart: unless-stopped

  api-gateway:
    image: nginx:alpine
    container_name: api-gateway
    ports:
      - "8000:8000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - user-service
      - author-service
      - blog-service
    restart: unless-stopped